  // --- Section-scoped search --------------------------------------
  // The search bar on a section page (Trending, Latest Releases, Rankings,
  // etc.) should only surface anime that actually belongs to that section,
  // not a blind sitewide title search. AniList-backed sections that support
  // combining a text search with their own status/sort filter get a single
  // accurate server-side query; sections without that (Jikan's charts, the
  // airing-schedule feed, A-Z, Season) get scanned page by page and filtered
  // by title, so a hit means the anime is genuinely listed there right now.
  const SCOPED_SEARCH_MAX_PAGES = 15; // ~360 entries scanned per section
  function titleMatches(a, q) {
    const needle = q.toLowerCase();
    return [a.title?.english, a.title?.romaji, a.title?.native, ...(a.title?.synonyms || [])]
      .some(t => t && t.toLowerCase().includes(needle));
  }
  async function scopedSectionFetch(kind, page) {
    if (kind === 'trending') return trendingPage(page, 24);
    if (kind === 'rankings') return jikanPage(`/top/anime?filter=bypopularity&page=${page}&limit=24`);
    if (kind === 'latest') return aniListAiringPage(page, 24);
    if (kind === 'az') return jikanAzPage(state.letter || 'All', page, 24);
    if (kind === 'season') return jikanSeason(state.seasonYear, state.seasonName, page);
    return aniListPage({ sort: ['POPULARITY_DESC'], page, perPage: 24 });
  }
  async function scopedSearchPage(kind, q) {
    const matches = [];
    const seen = new Set();
    let page = 1, hasMoreUnderlying = true;
    while (matches.length < 24 && hasMoreUnderlying && page <= SCOPED_SEARCH_MAX_PAGES) {
      let result;
      try { result = await scopedSectionFetch(kind, page); } catch (e) { break; }
      (result.items || []).forEach((a, idx) => {
        const key = a.malId ? `mal:${a.malId}` : `anilist:${a.aniListId}`;
        // Record the anime's real position in the section's own ordering (its
        // actual position on the MAL popularity page it was found on) rather than
        // its index among the filtered search matches, so a searched anime shows
        // its true position instead of always #1/#2/etc. Deliberately NOT using
        // a.rank here - that's a different, score-based MAL rank, not this list's position.
        if (!seen.has(key) && titleMatches(a, q)) { seen.add(key); matches.push({ ...a, _position: (page - 1) * 24 + idx + 1 }); }
      });
      hasMoreUnderlying = result.hasMore;
      page++;
    }
    return { items: matches, hasMore: false };
  }

  async function catalogPageData(kind) {
    const q = (state.query || '').trim();
    if (kind === 'anime' || kind === 'genres') {
      if (q || state.genre) return searchAnime(q, state.page, 24, state.genre); // Search + optional genre filter: Jikan first, AniList fallback
    } else if (q) {
      // AniList-backed sections: combine the search with the section's own filter in one query.
      if (kind === 'new-releases') return aniListPage({ status: 'RELEASING', sort: ['POPULARITY_DESC'], search: q, page: state.page, perPage: 24 });
      if (kind === 'top-airing') return aniListPage({ status: 'RELEASING', sort: ['SCORE_DESC'], search: q, page: state.page, perPage: 24 });
      if (kind === 'upcoming') return aniListPage({ status: 'NOT_YET_RELEASED', sort: ['POPULARITY_DESC'], search: q, page: state.page, perPage: 24 });
      if (kind === 'recently') return aniListPage({ sort: ['START_DATE_DESC'], search: q, page: state.page, perPage: 24 });
      // Everything else (Trending, Rankings, Latest Releases, A-Z, Season): scan that section's own listing.
      return scopedSearchPage(kind, q);
    }
    if (kind === 'trending') return trendingPage(state.page, 24);
    if (kind === 'latest') return aniListAiringPage(state.page, 24); // Latest Releases: recently-aired episodes (distinct from the "New Releases" home section)
    if (kind === 'new-releases') return aniListPage({ status: 'RELEASING', sort: ['POPULARITY_DESC'], page: state.page, perPage: 24 }); // mirrors the homepage "New Releases" section
    if (kind === 'top-airing') return aniListPage({ status: 'RELEASING', sort: ['SCORE_DESC'], page: state.page, perPage: 24 }); // mirrors the homepage "Top Airing" section
    if (kind === 'rankings') return jikanPage(`/top/anime?filter=bypopularity&page=${state.page}&limit=24`);
    if (kind === 'recently') return aniListPage({ sort: ['START_DATE_DESC'], page: state.page, perPage: 24 }); // AniList
    if (kind === 'upcoming') return aniListPage({ status: 'NOT_YET_RELEASED', sort: ['POPULARITY_DESC'], page: state.page, perPage: 24 });
    if (kind === 'genres' && state.genre) return searchAnime('', state.page, 24, state.genre); // Genres: Jikan first, AniList fallback
    if (kind === 'season') return jikanSeason(state.seasonYear, state.seasonName, state.page);
    if (kind === 'az') return jikanAzPage(state.letter || 'All', state.page, 24); // A-Z via MAL (Jikan)
    return aniListPage({ sort: ['POPULARITY_DESC'], page: state.page, perPage: 24 }); // default popular
  }

  // --- A-Z using MAL (Jikan), with an AniList-backed fallback ----
  // Jikan's list/search endpoints are the least reliable part of the free API (prone to
  // gateway timeouts under load) - unlike global search, which already races Jikan against
  // AniList and uses whichever responds, A-Z had no fallback at all, so a Jikan hiccup meant
  // every letter came back empty. This scans AniList's title-sorted list and filters
  // client-side for the same letter, exactly like the existing 0-9 bucket technique below,
  // and is used whenever the direct Jikan call fails.
  async function aniListLetterScan(letter, page, limit) {
    const cacheKey = 'anilist_az_' + letter;
    if (!state.azCache[cacheKey]) state.azCache[cacheKey] = { items: [], page: 1, hasMore: true, fetchedAll: false };
    const store = state.azCache[cacheKey];
    const matches = letter === '0-9'
      ? a => /^[0-9]/.test((a.title?.english || a.title?.romaji || '').trim())
      : a => (a.title?.english || a.title?.romaji || '').trim().toUpperCase().startsWith(letter);
    const needed = page * limit;
    while (store.items.length < needed && store.hasMore && !store.fetchedAll) {
      let result;
      try { result = await aniListPage({ sort: ['TITLE_ROMAJI'], page: store.page, perPage: 50 }); }
      catch (e) { store.fetchedAll = true; break; }
      store.items.push(...result.items.filter(matches));
      store.page++;
      store.hasMore = result.hasMore;
      if (!result.hasMore) store.fetchedAll = true;
      // Safety: stop after 30 pages (~1500 scanned) to avoid infinite loops
      if (store.page > 30) store.fetchedAll = true;
    }
    const start = (page - 1) * limit;
    const items = store.items.slice(start, start + limit);
    const hasMore = store.items.length > start + limit || (store.hasMore && !store.fetchedAll);
    return { items, hasMore };
  }
  async function jikanAzPage(letter, page = 1, limit = 24) {
    try {
      if (letter === 'All') {
        return await jikanPage(`/anime?order_by=title&sort=asc&page=${page}&limit=${limit}&sfw=true`);
      }
      if (letter !== '0-9') {
        // Jikan's `letter` filter returns matching entries server-side, already paginated
        return await jikanPage(`/anime?letter=${encodeURIComponent(letter)}&order_by=title&sort=asc&page=${page}&limit=${limit}&sfw=true`);
      }
    } catch (e) {
      return aniListLetterScan(letter, page, limit);
    }
    // Jikan has no dedicated "0-9" bucket, so fetch title-sorted pages and filter client-side,
    // caching progress so repeated pages don't re-fetch from the start.
    const cacheKey = 'azlist_0-9';
    if (!state.azCache[cacheKey]) state.azCache[cacheKey] = { items: [], page: 1, hasMore: true, fetchedAll: false };
    const store = state.azCache[cacheKey];
    const needed = page * limit;
    try {
      while (store.items.length < needed && store.hasMore && !store.fetchedAll) {
        const result = await jikanPage(`/anime?order_by=title&sort=asc&page=${store.page}&limit=25&sfw=true`);
        const filtered = result.items.filter(a => /^[0-9]/.test((a.title?.english || a.title?.romaji || '').trim()));
        store.items.push(...filtered);
        store.page++;
        store.hasMore = result.hasMore;
        if (!result.hasMore) store.fetchedAll = true;
        // Safety: stop after 20 pages (500 items) to avoid infinite loops
        if (store.page > 20) store.fetchedAll = true;
      }
    } catch (e) {
      if (!store.items.length) return aniListLetterScan(letter, page, limit);
    }
    const start = (page - 1) * limit;
    const items = store.items.slice(start, start + limit);
    const hasMore = store.items.length > start + limit || store.hasMore;
    return { items, hasMore };
  }

  // --- Jikan Season (kept for that section) -----------------------
  async function jikanSeason(year, season, page = 1) {
    return jikanPage(`/seasons/${year}/${season}?page=${page}&limit=24&sfw=true`);
  }

  // --- Load Catalog ---------------------------------------------
  // `silent` suppresses the inline error/retry message - used for automatic
  // background retries (e.g. rate-limit hiccups during auto-loading) so a
  // transient failure that resolves itself a moment later doesn't flash an
  // alarming "could not load" message on every attempt.
  function setLoadMoreBusy(busy) {
    const btn = document.querySelector('#loadMoreRow button');
    if (btn) btn.disabled = busy;
  }
  async function loadCatalog(kind, append = false, { silent = false } = {}) {
    const grid = $('catalogGrid');
    const more = $('catalogMoreState');
    if (state.loadingMore) return;
    const token = ++state.catalogRequestToken;
    state.loadingMore = true;
    state.catalogFetchError = false;
    setLoadMoreBusy(true);
    if (!append) { state.catalogIds = new Set(); grid.innerHTML = loading(); }
    else more.innerHTML = loading();
    try {
      const page = state.page;
      const result = await catalogPageData(kind);
      if (token !== state.catalogRequestToken || kind !== state.route) return;
      const fresh = dedupeAnime(result.items).filter(a => {
        const key = a.malId ? `mal:${a.malId}` : `anilist:${a.aniListId}`;
        if (state.catalogIds.has(key)) return false;
        state.catalogIds.add(key);
        return true;
      });
      state.hasMore = result.hasMore;
      // NOTE: Jikan's `a.rank` field is the anime's separate score-based "Top Anime"
      // rank, not its position in this popularity-ordered list - using it here would
      // show the wrong number (e.g. a very popular show showing as "#125"). The
      // correct rank for this page is simply the item's position in the sequence
      // of pages actually fetched from the MAL popularity endpoint.
      const rankOf = (a, i) => a._position || ((page - 1) * 24 + i + 1);
      if (!append) grid.innerHTML = fresh.length ? fresh.map((a, i) => kind === 'rankings' ? rankCard(a, rankOf(a, i)) : card(a)).join('') : empty('No anime found. Try another search or filter.');
      else if (fresh.length) grid.insertAdjacentHTML('beforeend', fresh.map((a, i) => kind === 'rankings' ? rankCard(a, rankOf(a, i)) : card(a)).join(''));
      more.innerHTML = state.hasMore ? '' : empty('No more anime found.');
      if ($('loadMoreRow')) $('loadMoreRow').style.display = state.hasMore ? 'flex' : 'none';
    } catch(e) {
      if (token !== state.catalogRequestToken) return;
      state.hasMore = false;
      state.catalogFetchError = true;
      if (!silent) {
        if (!append) grid.innerHTML = errorState('Anime data was slow or unavailable. Please try again.', 'retryCatalogLoad(false)');
        else more.innerHTML = errorState('Could not load more anime.', 'retryCatalogLoad(true)');
      }
      if ($('loadMoreRow')) $('loadMoreRow').style.display = 'none';
    } finally {
      if (token === state.catalogRequestToken) { state.loadingMore = false; setLoadMoreBusy(false); }
    }
  }

  function resetCatalogState() {
    state.page = 1;
    state.hasMore = true;
    state.loadingMore = false;
    state.catalogIds = new Set();
    state.catalogRequestToken++;
    if (state.infiniteObserver) { state.infiniteObserver.disconnect(); state.infiniteObserver = null; }
    // Do NOT clear azCache here; we want to preserve fetched A-Z data
    // if (state.route === 'az') state.azCache = {};
  }

  function setupInfiniteScroll() {
    if (state.infiniteObserver) { state.infiniteObserver.disconnect(); state.infiniteObserver = null; }
    const prefs = getPrefs();
    const sentinel = $('catalogSentinel');
    const row = $('loadMoreRow');
    if (row) row.style.display = state.hasMore ? 'flex' : 'none';
    if (!prefs.infiniteScroll || !sentinel) return;
    state.infiniteObserver = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting) && state.hasMore && !state.loadingMore) nextPage();
    }, { rootMargin: '500px 0px' });
    state.infiniteObserver.observe(sentinel);
  }

  window.setGenre = g => {
    if (state.route === 'genres') { state.genre = g; state.query = ''; state.page = 1; renderCatalog('genres'); return; }
    const newGenre = state.genre === g ? null : g;
    state.genre = newGenre;
    state.page = 1;
    const params = new URLSearchParams();
    if (state.query) params.set('q', state.query);
    if (newGenre) params.set('genre', newGenre);
    const target = params.toString() ? `#/anime?${params.toString()}` : '#/anime';
    if (location.hash === target) renderCatalog('anime'); else location.hash = target;
  };
  window.setLetter = l => {
    state.letter = l;
    state.query = '';
    state.page = 1;
    state.hasMore = true;
    state.loadingMore = false;
    state.catalogIds = new Set();
    state.catalogRequestToken++;
    // Do not clear azCache; we want to reuse fetched data
    renderCatalog('az');
  };
  window.setSeasonYear = y => { const year = Number(y); if (!year) return; state.seasonYear = year; state.query = ''; state.page = 1; renderCatalog('season'); };
  window.setSeasonName = s => { if (!seasonNames.includes(s)) return; state.seasonName = s; state.query = ''; state.page = 1; renderCatalog('season'); };
  window.nextPage = () => { if (state.loadingMore || !state.hasMore) return; state.page++; loadCatalog(state.route, true); };

  // --- Auto-load-all for the homepage-linked sections -------------
  // These are the catalogue pages reached from the navbar / homepage "View All"
  // buttons (Trending, Latest Releases, Top Airing, New Releases, Upcoming,
  // Rankings). Instead of making the user repeatedly press "Load More", we keep
  // fetching subsequent pages automatically as soon as the page opens - the same
  // way MAL shows hundreds of entries per section - up to a safety cap so a
  // single page load can't hammer the API forever.
  const AUTO_LOAD_KINDS = ['trending', 'latest', 'top-airing', 'new-releases', 'upcoming', 'rankings'];
  // Rankings mirrors MAL's full ranked list, so it gets a much higher safety
  // ceiling than the other sections - it keeps auto-loading page after page
  // until Jikan reports no more results (hasMore false), effectively showing
  // every anime MAL lists under Rankings, rather than stopping artificially early.
  const AUTO_LOAD_MAX_PAGES = { default: 20, rankings: 300 }; // default: 20 pages x 24 = ~480 entries; rankings: up to ~7200 entries
  async function autoLoadAllPages(kind) {
    const maxPages = AUTO_LOAD_MAX_PAGES[kind] ?? AUTO_LOAD_MAX_PAGES.default;
    const row = $('loadMoreRow');
    if (row) row.style.display = 'none';
    let retries = 0;
    while (state.route === kind && state.hasMore && state.page < maxPages) {
      const attemptedPage = state.page + 1;
      state.page = attemptedPage;
      // Silent while retries remain - only the final, truly-failed attempt should
      // surface a visible error, so a self-resolving hiccup never looks like an error.
      await loadCatalog(kind, true, { silent: retries < 3 });
      if (state.route !== kind) return;
      if (state.catalogFetchError) {
        // A rate-limit or transient network hiccup, not genuinely "no more anime" -
        // wait a moment and retry the same page a few times before giving up.
        if (retries < 3) {
          retries++;
          state.page = attemptedPage - 1;
          state.hasMore = true;
          await sleep(1000 * retries);
          continue;
        }
        // Retries exhausted - loadCatalog already rendered the error (with retry) above.
        return;
      } else {
        retries = 0;
      }
      if (state.hasMore && state.page < maxPages && $('loadMoreRow')) $('loadMoreRow').style.display = 'none';
    }
  }
  // Retry button handler for the "Could not load" states - resumes auto-loading
  // for sections that auto-load, or does a normal (or load-more) fetch otherwise.
  window.retryCatalogLoad = append => {
    state.catalogFetchError = false;
    state.hasMore = true;
    if (append && AUTO_LOAD_KINDS.includes(state.route) && !(state.query || '').trim()) autoLoadAllPages(state.route);
    else loadCatalog(state.route, append);
  };

  // --- Details Page ---------------------------------------------
  function infoGrid(a) {
    const vals = [
      ['Type', a.format],
      ['Status', a.status],
      ['Release date', a.aired?.from ? new Date(a.aired.from).toLocaleDateString() : 'Unknown'],
      ['Studios', a.studios?.join(', ') || 'Unknown'],
      ['Episodes', a.episodes || 'Unknown'],
      ['Duration', a.duration || 'Unknown'],
      ['Genres', a.genres?.join(', ') || 'Unknown'],
      ['Source', a.source || 'Unknown'],
      ['Score', a.score || 'Unscored'],
    ];
    return `<div class="info-grid">${vals.map(([l, v]) => `<div class="info-item"><div class="info-label">${esc(l)}</div><div class="info-value">${esc(v)}</div></div>`).join('')}</div>`;
  }

  function relatedCards(a) {
    const rel = (a.relations || []).filter(r => r.node && (r.node.type === 'ANIME' || r.node.type === 'MANGA'));
    if (!rel.length) return empty('No related entries found.');
    const relCard = r => {
      const node = r.node;
      const malId = validMalId(node.idMal);
      const anilistId = node.id;
      const title = node.title?.english || node.title?.romaji || 'Unknown';
      const link = malId ? `#/anime/${toSlug(title)}-${malId}` : `#/anime/${toSlug(title)}-anilist-${anilistId}`;
      // Jikan's relations data has no cover images at all (only AniList's does) -
      // fall back to a placeholder and lazily backfill the real cover after render.
      const cover = node.coverImage?.large || '';
      const coverKey = !cover && malId ? `mal-${malId}` : '';
      return `<article class="rank-card" onclick="location.hash='${link}'">
        <div class="rank-num"><i class="fas fa-link"></i></div>
        <img class="rank-cover" ${coverKey ? `data-cover-key="${coverKey}"` : ''} src="${cover || PLACEHOLDER_COVER}" alt="${esc(title)}" onerror="this.src='${PLACEHOLDER_COVER}'"/>
        <div>
          <div class="rank-title">${esc(title)}</div>
          <div class="rank-stats"><span class="badge neon">${esc(r.relationType.replace(/_/g, ' '))}</span></div>
        </div>
      </article>`;
    };
    const html = cardsWithLoadMore(rel, relCard, 12, 12);
    setTimeout(lazyLoadRelatedCovers, 0);
    return html;
  }

  async function lazyLoadRelatedCovers() {
    const imgs = Array.from(document.querySelectorAll('img.rank-cover[data-cover-key]'));
    const seen = new Set();
    await Promise.all(imgs.map(async img => {
      const key = img.dataset.coverKey;
      if (seen.has(key)) return;
      seen.add(key);
      const malId = key.replace('mal-', '');
      try {
        const d = await jikanFetch(`/anime/${malId}`);
        const cover = d.data?.images?.jpg?.large_image_url || d.data?.images?.webp?.large_image_url;
        if (cover) document.querySelectorAll(`img.rank-cover[data-cover-key="${key}"]`).forEach(el => el.src = cover);
      } catch(e) {}
    }));
  }

  // --- Real recommendations (Jikan /recommendations + AniList recommendations,
  // merged & de-duped) - this is a distinct dataset from `relations` (prequels/
  // sequels/side-stories); reusing relations here was why this section always
  // went empty together with Seasons & Related. ---------------------------
  async function jikanRecommendations(malId) {
    const d = await jikanFetch(`/anime/${malId}/recommendations`);
    return (d.data || [])
      .sort((x, y) => (y.votes || 0) - (x.votes || 0))
      .map(r => {
        const e = r.entry || {};
        return {
          malId: validMalId(e.mal_id),
          aniListId: null,
          title: { english: e.title, romaji: e.title },
          cover: e.images?.jpg?.large_image_url || e.images?.webp?.large_image_url || e.images?.jpg?.image_url || PLACEHOLDER_COVER,
          format: '', status: '', score: null, episodes: null
        };
      });
  }

  async function aniListRecommendations(malId, aniListId) {
    const query = `
      query($idMal:Int, $id:Int) {
        Media(idMal:$idMal, id:$id, type:ANIME) {
          recommendations(sort: RATING_DESC, perPage: 25) {
            nodes { mediaRecommendation { id idMal title { romaji english } coverImage { large } format status episodes averageScore } }
          }
        }
      }
    `;
    const variables = malId ? { idMal: malId } : { id: aniListId };
    const data = await aniListFetch(query, variables);
    const nodes = data?.Media?.recommendations?.nodes || [];
    return nodes.map(n => n.mediaRecommendation).filter(Boolean).map(m => ({
      malId: validMalId(m.idMal),
      aniListId: m.id,
      title: { english: m.title?.english, romaji: m.title?.romaji },
      cover: m.coverImage?.large || PLACEHOLDER_COVER,
      format: m.format || '', status: m.status || '',
      score: m.averageScore ? Number((m.averageScore / 10).toFixed(1)) : null,
      episodes: m.episodes || null
    }));
  }

  async function renderDetails(id) {
    setPage('detailsPage');
    $('detailsPage').innerHTML = loading();
    try {
      const a = await animeById(id);
      state.currentAnime = a;
      const title = a.title.english || a.title.romaji;
      setMeta(`${title} - ANICADE`, strip(a.synopsis).slice(0, 160) || 'Anime details on ANICADE.', a.cover);
      $('detailsPage').innerHTML = `
        <section class="detail-hero">
          <div class="detail-bg" style="background-image:url('${a.cover || PLACEHOLDER_COVER}')"></div>
          <div class="detail-poster"><img src="${a.cover || PLACEHOLDER_COVER}" alt="${esc(title)}" onerror="this.src='${PLACEHOLDER_COVER}'"/></div>
          <div class="detail-main">
            <div class="eyebrow">Anime details</div>
            <h1>${esc(title)}</h1>
            ${a.title.native ? `<div class="alt-title">${esc(a.title.native)}</div>` : ''}
            <div class="badges">
              ${[a.format, a.status, a.episodes ? `${a.episodes} episodes` : null, a.season && a.year ? `${a.season} ${a.year}` : a.year, a.score ? `Score: ${a.score}` : null].filter(Boolean).map(x => `<span class="badge neon">${esc(x)}</span>`).join('')}
            </div>
            <p class="synopsis">${esc(strip(a.synopsis) || 'No synopsis available.')}</p>
            <div class="action-row">
              ${a.status === 'NOT_YET_RELEASED'
                ? `<button class="btn-primary" id="notifyBtn" onclick="toggleNotify()"><i class="fas fa-bell"></i> ${isNotifyRequested(a) ? 'Notified' : 'Notify Me'}</button>`
                : `<a class="btn-primary" href="${watchHrefForAnime(a, 1)}"><i class="fas fa-play"></i> Watch Now</a>`}
              <button class="btn-outline" onclick="toggleWatchlist(${a.malId || a.aniListId})"><i class="fas fa-bookmark"></i> Watchlist</button>
            </div>
          </div>
        </section>
        ${shell('INFO','SERIES <span>INFO</span>','Anime metadata', infoGrid(a))}
        ${shell('SEASONS','SEASONS <span>& RELATED</span>','Related entries', `<div class="wide-grid">${relatedCards(a)}</div>`)}
        ${shell('REC','RECOMMENDED <span>ANIME</span>','Related picks', `<div class="grid" id="recommendGrid">${loading()}</div>`)}
        ${azSection()}
      `;
      loadRecommendations(a, 'recommendGrid');
    } catch(e) {
      $('detailsPage').innerHTML = shell('ERR','ANIME <span>UNAVAILABLE</span>','Could not load details', notFoundState('This anime could not be loaded. Check the anime link and try again.'));
    }
  }

  function extractMalIdFromSlug(slugOrId) {
    const match = String(slugOrId).match(/(\d+)$/);
    if (!match) return null;
    const id = Number(match[1]);
    const prefix = String(slugOrId).replace(match[0], '').toLowerCase();
    if (prefix.includes('anilist')) return `anilist-${id}`;
    return id;
  }

  async function loadRecommendations(a, target) {
    try {
      const [jikanRecs, aniRecs] = await Promise.all([
        a.malId ? jikanRecommendations(a.malId).catch(() => []) : Promise.resolve([]),
        (a.malId || a.aniListId) ? aniListRecommendations(a.malId, a.aniListId).catch(() => []) : Promise.resolve([])
      ]);
      const seen = new Set();
      const merged = [];
      [...jikanRecs, ...aniRecs].forEach(r => {
        if (!r.malId && !r.aniListId) return;
        const key = r.malId ? `mal-${r.malId}` : `ani-${r.aniListId}`;
        if (seen.has(key)) return;
        seen.add(key);
        merged.push(r);
      });
      $(target).innerHTML = merged.length ? cardsWithLoadMore(merged, card, 12, 12) : empty('No recommendations available.');
    } catch(e) {
      $(target).innerHTML = errorState('Could not load recommendations.');
    }
  }

  // --- Watch Page ----------------------------------------------
  // How many episodes are actually out yet - `a.episodes` is often the total
  // *planned* count (announced upfront), not what's aired so far, which was
  // letting ongoing shows list episode buttons/links that 404 because the
  // episode hasn't released yet.
  function releasedEpisodeCount(a) {
    const total = validEpisode(a.episodes);
    // Only gate on nextAiringEpisode being present, not on a.status === 'RELEASING': that enum
    // string only ever comes from AniList, while MAL/Jikan-sourced anime carry a human status
    // like "Currently Airing" instead - matching against 'RELEASING' silently failed for every
    // MAL-sourced show (One Piece included), even after enriching it with AniList airing data.
    if (a.nextAiringEpisode?.episode) {
      const aired = a.nextAiringEpisode.episode - 1;
      return total ? Math.min(total, Math.max(aired, 1)) : Math.max(aired, 1);
    }
    return total || 12;
  }

  function episodeButtons(a) {
    const count = releasedEpisodeCount(a);
    let html = '';
    // No artificial cap on how many episode buttons render - long-running shows (One Piece,
    // Detective Conan, etc.) can have 1000+ released episodes and should all be selectable.
    for (let i = 1; i <= count; i++) html += `<button class="episode-btn ${i === state.episode ? 'active' : ''}" onclick="setEpisode(${i})">${i}</button>`;
    return html;
  }

  function ongoingNotice(a) {
    if (!a.nextAiringEpisode?.episode) return '';
    const airingAt = a.nextAiringEpisode.airingAt;
    const text = airingAt ? countdownFromSeconds(a.nextAiringEpisode.timeUntilAiring ?? (airingAt - Math.floor(Date.now() / 1000))) : '';
    return `<div class="anime-meta" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
      <i class="fas fa-broadcast-tower" style="color:var(--neon);margin-right:6px"></i>This anime is ongoing.
      Episode ${a.nextAiringEpisode.episode} ${airingAt ? `<span data-airing="${airingAt}">${esc(text)}</span>` : 'release date TBA'}
    </div>`;
  }

  async function renderWatch(id) {
    setPage('watchPage');
    $('watchPage').innerHTML = loading();
    try {
      const a = await animeById(id);
      state.currentAnime = a;
      const p = new URLSearchParams(location.hash.split('?')[1] || '');
      state.track = validTrack(p.get('track')) || 'sub';
      const title = a.title.english || a.title.romaji;
      const malId = validMalId(a.malId);
      // Pages reached by MAL id (the common path) come from Jikan, which never carries an
      // AniList id (normalizeJikan always sets aniListId: null). Without this, NARUTO/SASUKE
      // (the AniList-id servers) would be permanently disabled for almost every anime.
      // While we're asking AniList for the id, also pull episodes/status/nextAiringEpisode:
      // Jikan often reports `episodes: null` for long-running ongoing shows (e.g. One Piece),
      // which used to make releasedEpisodeCount() fall back to a hardcoded 12. AniList tracks
      // the real aired-episode count for these via nextAiringEpisode, so use it to fill the gap.
      if (!a.aniListId && malId) {
        try {
          const idQuery = `query($idMal:Int){Media(idMal:$idMal,type:ANIME){id episodes status nextAiringEpisode{airingAt episode timeUntilAiring}}}`;
          const idData = await aniListFetch(idQuery, { idMal: malId });
          const media = idData?.Media;
          if (media?.id) a.aniListId = media.id;
          if (!a.episodes && media?.episodes) a.episodes = media.episodes;
          if (!a.nextAiringEpisode && media?.nextAiringEpisode) a.nextAiringEpisode = media.nextAiringEpisode;
          if (!a.status && media?.status) a.status = media.status;
        } catch (e) {}
      }
      const maxEp = releasedEpisodeCount(a);
      state.episode = validEpisode(p.get('ep')) || 1;
      if (maxEp && state.episode > maxEp) state.episode = maxEp;
      const desiredServer = validServer(p.get('server'));
      const picked = firstWorkingServer(a, state.episode, state.track, desiredServer);
      if (!picked) throw new Error('Invalid stream URL');
      state.server = picked.id;
      const src = picked.url;
      setMeta(`Watch ${title} - ANICADE`, `Watch ${title} episode ${state.episode} on ANICADE.`, a.cover);
      installNavGuard();
      $('watchPage').innerHTML = `
        ${shell('WATCH', `WATCH <span>${esc(title)}</span>`, 'Anime ANICADE streaming', `
          <div class="watch-layout">
            <div>
              <div class="player-box"><iframe id="anime-player" src="${src}" width="100%" height="500" allow="fullscreen" allowfullscreen ${iframeSandboxAttr(state.server)} referrerpolicy="no-referrer-when-downgrade" title="${esc(title)} episode ${state.episode} ${state.track}"></iframe><div class="player-fallback" id="playerFallback" style="display:none"><img src="${GOJO_404_IMG}" alt="" class="notfound-img" onerror="this.style.display='none'"/><div class="pf-text"></div></div></div>
              <div class="server-bar" id="serverBar">
                <div class="server-chip-row" id="serverChipRow">
                  ${SERVER_ORDER.map(id => {
                    const s = SERVERS[id];
                    const available = !!buildServerUrl(id, a, state.episode, state.track);
                    const active = id === state.server;
                    return `<button class="server-chip${active ? ' active' : ''}${available ? '' : ' disabled'}" data-server="${id}" ${available ? `onclick="setServer('${id}')"` : 'disabled title="Unavailable for this anime"'}>${s.label}</button>`;
                  }).join('')}
                </div>
                <div class="server-note" id="serverNote">You are watching <strong>Episode ${state.episode}</strong> — if the current server doesn't work, please switch to another server.</div>
              </div>
              <div id="playerMessage" class="player-message">Episode ${state.episode} · ${state.track.toUpperCase()} · ${SERVERS[state.server].label}</div>
              <div class="action-row" style="margin-top:12px">
                <button class="btn-outline" onclick="saveProgress(${malId}, state.episode, {started:true})"><i class="fas fa-clock"></i> Save Progress</button>
                <a class="btn-outline" href="${animeDetailsLink(a)}"><i class="fas fa-info-circle"></i> Anime Details</a>
              </div>
            </div>
            <aside class="episode-panel">
              <div class="season-select" id="seasonSelect" style="display:none">
                <div class="season-select-label">Season</div>
                <div class="season-chip-row" id="seasonChipRow"></div>
              </div>
              <h2 class="section-title" style="font-size:24px">Episodes</h2>
              <div class="track-toggle">
                <button class="chip-btn ${state.track === 'dub' ? 'active' : ''}" onclick="setTrack('dub')">DUB</button>
                <button class="chip-btn ${state.track === 'sub' ? 'active' : ''}" onclick="setTrack('sub')">SUB</button>
              </div>
              <div class="episode-list">${episodeButtons(a)}</div>
              ${ongoingNotice(a)}
            </aside>
          </div>
        `)}
        ${shell('ABOUT','ANIME <span>INFO</span>','Below the player', infoGrid(a))}
        ${shell('REC','RELATED <span>ANIME</span>','Recommendations', `<div class="grid" id="watchRecs">${loading()}</div>`)}
        ${azSection()}
      `;
      loadRecommendations(a, 'watchRecs');
      loadSeasonSelector(a);
      armWatchdog();
    } catch(e) {
      $('watchPage').innerHTML = shell('ERR','WATCH <span>UNAVAILABLE</span>','Could not load watch page', notFoundState('This watch page could not be opened.'));
    }
  }

  async function loadSeasonSelector(anime) {
    const wrap = $('seasonSelect');
    const row = $('seasonChipRow');
    if (!wrap || !row) return;
    const requestId = ++state.seasonRequestToken;
    try {
      const chain = await buildSeasonChain(anime);
      if (requestId !== state.seasonRequestToken) return; // navigated away mid-fetch
      state.seasonChain = chain;
      if (chain.length < 2) { wrap.style.display = 'none'; return; }
      const currentKey = animeKey(state.currentAnime);
      row.innerHTML = chain.map((entry, i) => {
        const active = animeKey(entry.anime) === currentKey ? ' active' : '';
        return `<button class="season-chip${active}" onclick="selectSeasonIndex(${i})">${esc(entry.label)}</button>`;
      }).join('');
      wrap.style.display = '';
    } catch(e) {
      if (requestId === state.seasonRequestToken) wrap.style.display = 'none';
    }
  }
  window.selectSeasonIndex = i => {
    const entry = state.seasonChain && state.seasonChain[i];
    if (!entry) return;
    const target = watchHrefForAnime(entry.anime, 1);
    if (location.hash === target) return;
    location.hash = target;
  };

  function streamKey(id = state.currentAnime?.malId, ep = state.episode) {
    const malId = validMalId(id);
    return malId && ep ? `${malId}:${ep}` : '';
  }
  function markStreamUi(track = state.track) {
    document.querySelectorAll('.episode-btn').forEach((b, i) => b.classList.toggle('active', i + 1 === state.episode));
    document.querySelectorAll('.track-toggle .chip-btn').forEach(b => b.classList.toggle('active', b.textContent.trim().toLowerCase() === track));
  }
  function markServerUi() {
    document.querySelectorAll('.server-chip').forEach(b => b.classList.toggle('active', b.dataset.server === state.server));
  }
  function updateServerNote() {
    const el = $('serverNote');
    if (el) el.innerHTML = `You are watching <strong>Episode ${state.episode}</strong> — if the current server doesn't work, please switch to another server.`;
  }
  function rebuildPlayerIframe(src, serverId, title, ep, track) {
    const box = document.querySelector('.player-box');
    const old = $('anime-player');
    if (!box) { if (old) old.src = src; return old; }
    const iframe = document.createElement('iframe');
    iframe.id = 'anime-player';
    iframe.setAttribute('width', '100%');
    iframe.setAttribute('height', '500');
    iframe.setAttribute('allow', 'fullscreen');
    iframe.setAttribute('allowfullscreen', '');
    // Recreating the element (instead of mutating an existing iframe's attribute) guarantees the
    // sandboxing flags are read fresh - some browsers keep applying a frame's original sandbox
    // state even after the attribute is changed and only the src is swapped.
    if (serverNeedsSandbox(serverId)) iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation allow-forms');
    iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    iframe.setAttribute('title', `${title} episode ${ep} ${track}`);
    iframe.src = src;
    if (old) old.replaceWith(iframe); else box.insertBefore(iframe, box.firstChild);
    return iframe;
  }
  function updateAnimePlayer() {
    const a = state.currentAnime;
    const ep = validEpisode(state.episode);
    const track = validTrack(state.track);
    if (!a || !ep || !track) return;
    let src = buildServerUrl(state.server, a, ep, track);
    if (!src) {
      // Selected server has no valid id for this anime (e.g. no AniList id) - fall back gracefully.
      const fallback = firstWorkingServer(a, ep, track);
      if (!fallback) return;
      state.server = fallback.id;
      src = fallback.url;
    }
    const title = a.title?.english || a.title?.romaji || 'anime';
    rebuildPlayerIframe(src, state.server, title, ep, track);
    markStreamUi(track);
    markServerUi();
    updateServerNote();
    playerMessage(`Episode ${ep} · ${track.toUpperCase()} · ${SERVERS[state.server].label}`);
    history.replaceState(null, '', watchHrefForAnime(a, ep, track, state.server));
    armWatchdog();
  }
  function showPlayerFallback(msg) {
    // Overlay disabled for now (it was firing falsely on network lag, not just on real
    // dub-unavailability). A proper notice will be added back later. The track-switching /
    // error-handling logic below is untouched, it just no longer covers the player with this box.
    return;
  }
  function hidePlayerFallback() {
    const el = $('playerFallback');
    if (el) el.style.display = 'none';
  }
  function fallbackToSub() {
    const key = streamKey();
    if (state.track !== 'dub' || !key || state.streamFallbacks.has(key)) return false;
    state.streamFallbacks.add(key);
    state.track = 'sub';
    showPlayerFallback("This anime isn't in Dub yet.");
    updateAnimePlayer();
    playerMessage("This anime isn't in Dub yet. Switched to SUB.");
    return true;
  }
  function handleStreamFailure() {
    if (fallbackToSub()) return;
    showPlayerFallback('Anime unavailable for this episode in DUB or SUB');
    playerMessage('Anime unavailable for this episode in DUB or SUB', true);
  }
  function disarmWatchdog() {
    if (state.watchdogTimer) { clearTimeout(state.watchdogTimer); state.watchdogTimer = null; }
    state.watchdogToken++;
  }
  function armWatchdog() {
    // Timeout-based "assume it failed" watchdog disabled: a slow/laggy connection was enough to
    // trip it even though the dub stream was actually fine and just still loading. Real failures
    // are still handled via the player's genuine 'error' message (see the message listener below).
    disarmWatchdog();
  }
  window.setEpisode = ep => {
    const n = validEpisode(ep);
    if (!n || !state.currentAnime) return;
    const max = validEpisode(state.currentAnime.episodes);
    state.episode = max && n > max ? max : n;
    state.streamFallbacks.delete(streamKey());
    hidePlayerFallback();
    updateAnimePlayer();
  };
  window.setTrack = t => {
    const track = validTrack(t);
    if (!track || !state.currentAnime) return;
    state.track = track;
    if (track === 'dub') state.streamFallbacks.delete(streamKey());
    hidePlayerFallback();
    updateAnimePlayer();
  };
  window.setServer = serverId => {
    const id = validServer(serverId);
    if (!id || !state.currentAnime) return;
    if (!buildServerUrl(id, state.currentAnime, state.episode, state.track)) {
      showToast(`${SERVERS[id].label} is unavailable for this anime`);
      return;
    }
    state.server = id;
    state.streamFallbacks.delete(streamKey());
    hidePlayerFallback();
    updateAnimePlayer();
  };
  window.toggleWatchlist = id => {
    const malId = validMalId(id);
    const list = readJson(ANICADE_KEYS.watchlist, []);
    const exists = list.includes(malId);
    const next = exists ? list.filter(x => x !== malId) : [malId, ...list];
    if (!malId) return;
    writeJson(ANICADE_KEYS.watchlist, next);
    showToast(exists ? 'Removed from watchlist' : 'Added to watchlist');
  };
  function setNotifyButtonState(active) {
    const btn = $('notifyBtn');
    if (!btn) return;
    btn.innerHTML = active ? '<i class="fas fa-bell"></i> Notified' : '<i class="fas fa-bell"></i> Notify Me';
    btn.classList.toggle('active', active);
  }
  window.toggleNotify = async function() {
    const a = state.currentAnime;
    const key = notifyKeyFor(a);
    if (!key) return;
    const map = readJson(ANICADE_KEYS.notify, {});
    const btn = $('notifyBtn');

    if (map[key]) {
      // Already requested - cancel it.
      const docId = map[key].docId;
      delete map[key];
      writeJson(ANICADE_KEYS.notify, map);
      setNotifyButtonState(false);
      showToast('Notification request cancelled');
      if (docId && notifyDb) {
        notifyDb.collection('notifyRequests').doc(docId).delete().catch(() => {});
      }
      return;
    }

    const title = a.title?.english || a.title?.romaji || 'this anime';
    const email = window.prompt(`We'll email you when "${title}" becomes available. Enter your email:`);
    if (!email) return;
    const trimmed = email.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) { showToast('Enter a valid email address'); return; }

    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; }
    try {
      let docId = key;
      if (notifyDb) {
        const ref = await notifyDb.collection('notifyRequests').add({
          key,
          malId: validMalId(a.malId) || null,
          aniListId: a.aniListId || null,
          title,
          status: a.status || null,
          email: trimmed,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        docId = ref.id;
      }
      map[key] = { email: trimmed, docId };
      writeJson(ANICADE_KEYS.notify, map);
      setNotifyButtonState(true);
      showToast(notifyDb ? "You'll be notified when this is available" : 'Saved locally (Firebase not configured yet)');
    } catch (e) {
      showToast('Could not save notification request');
      if (btn) setNotifyButtonState(false);
    } finally {
      if (btn) btn.disabled = false;
    }
  };
  function playerMessage(msg, error = false) {
    const el = $('playerMessage');
    if (el) { el.textContent = msg; el.classList.toggle('error', error); }
  }
  function saveProgress(malId, episode, patch = {}) {
    const id = validMalId(malId);
    const ep = validEpisode(episode);
    if (!id || !ep) return;
    const map = readJson(ANICADE_KEYS.progress, {});
    const key = `${id}:${ep}`;
    const a = state.currentAnime;
    const meta = (a && validMalId(a.malId) === id)
      ? { title: a.title?.english || a.title?.romaji || 'Unknown', cover: a.cover || a.image || PLACEHOLDER_COVER }
      : { title: map[key]?.title, cover: map[key]?.cover };
    map[key] = { malId: id, episode: ep, track: state.track, updatedAt: Date.now(), ...meta, ...patch };
    writeJson(ANICADE_KEYS.progress, map);
    if (!patch.silent) showToast('Progress saved');
  }
  // Trusted postMessage origin for the currently active server (Zokoanime for GOJO/NARUTO,
  // MegaPlay/Anikoto for SUKUNA/SASUKE). In production, always check event.origin matches the
  // embed's own origin before trusting a message - never trust event.data alone.
  function activeServerOrigin() {
    const s = SERVERS[state.server];
    return s ? s.origin : ZOKO_ORIGIN;
  }
  window.addEventListener('message', event => {
    if (event.origin !== activeServerOrigin()) return;
    let data = event.data;
    if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { return; } }
    if (!data || typeof data !== 'object') return;
    const malId = validMalId(state.currentAnime?.malId);

    // Normalize the two known embed schemas into one shape:
    //  - Zokoanime: { type: 'progress'|'complete'|'error', payload: { currentTime, duration } }
    //  - Anikoto/MegaPlay: { event: 'time'|'complete'|'error', time, duration } or { type: 'watching-log', currentTime, duration }
    let kind = null, currentTime = 0, duration = 0;
    if (data.type === 'progress') { kind = 'progress'; currentTime = data.payload?.currentTime || 0; duration = data.payload?.duration || 0; }
    else if (data.type === 'complete') { kind = 'complete'; currentTime = data.payload?.duration || data.payload?.currentTime || 0; duration = data.payload?.duration || 0; }
    else if (data.type === 'error') { kind = 'error'; }
    else if (data.type === 'watching-log') { kind = 'progress'; currentTime = data.currentTime || 0; duration = data.duration || 0; }
    else if (data.event === 'time') { kind = 'progress'; currentTime = data.time || 0; duration = data.duration || 0; }
    else if (data.event === 'complete') { kind = 'complete'; currentTime = data.duration || data.time || 0; duration = data.duration || 0; }
    else if (data.event === 'error') { kind = 'error'; }
    else return;

    disarmWatchdog();
    if (kind === 'progress') {
      hidePlayerFallback();
      saveProgress(malId, state.episode, { currentTime, duration, silent: true });
      playerMessage(`Episode ${state.episode} · ${state.track.toUpperCase()} · ${SERVERS[state.server].label} · Progress saved`);
    } else if (kind === 'complete') {
      saveProgress(malId, state.episode, { complete: true, currentTime, duration, silent: true });
      playerMessage('Episode complete');
    } else if (kind === 'error') {
      handleStreamFailure();
    }
  });

  // --- News Page ------------------------------------------------
  async function renderNews() {
    setPage('newsPage');
    $('newsPage').innerHTML = shell('NEWS','ANIME <span>NEWS</span>','Latest airing updates, powered by AniList', `<div class="news-grid" id="newsGrid">${loading()}</div>`);
    try {
      const [airing, trending] = await Promise.all([
        aniListAiringPage(1, 12).catch(() => ({ items: [] })),
        aniListPage({ sort: ['TRENDING_DESC'], status: 'RELEASING', perPage: 12 }).catch(() => ({ items: [] }))
      ]);
      const seen = new Set();
      const items = [];
      [...airing.items, ...trending.items].forEach(a => {
        const key = a.aniListId || a.malId;
        if (!a || !key || seen.has(key)) return;
        seen.add(key);
        items.push(a);
      });
      $('newsGrid').innerHTML = items.length ? items.slice(0, 12).map(newsCard).join('') : empty('No anime updates are available right now.');
    } catch(e) {
      $('newsGrid').innerHTML = errorState('Could not load news.');
    }
  }

  function newsCard(a) {
    const title = a.title.english || a.title.romaji;
    const ep = a.nextAiringEpisode?.episode;
    const when = a.nextAiringEpisode?.airingAt ? new Date(a.nextAiringEpisode.airingAt * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : null;
    const headline = ep ? `Episode ${ep}${when ? ` airing ${when}` : ' airing soon'}` : (a.status ? a.status.replace(/_/g, ' ') : 'Update');
    const excerpt = strip(a.synopsis).slice(0, 150) || 'No synopsis available.';
    const detailsLink = animeDetailsLink(a);
    return `<article class="news-card" style="cursor:pointer" onclick="location.hash='${detailsLink}'">
      <img src="${a.cover || PLACEHOLDER_COVER}" alt="" onerror="this.src='${PLACEHOLDER_COVER}'"/>
      <div class="news-body">
        <div class="news-source">AniList Update</div>
        <h3 class="news-title">${esc(title)}</h3>
        <p class="news-excerpt"><strong>${esc(headline)}</strong> · ${esc(excerpt)}</p>
      </div>
    </article>`;
  }

  // --- Router ------------------------------------------------
  function route() {
    const raw = location.hash.replace(/^#/, '') || '/';
    const [path, qs = ''] = raw.split('?');
    const p = new URLSearchParams(qs);
    state.query = p.get('q') || '';
    state.genre = p.get('genre') || null;
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.remove('active'));
    if (path !== '/' && path !== '/home') clearHomeIntervals();
    if (!path.match(/^\/watch\//)) removeNavGuard();
    let m;
    if (path === '/' || path === '/home') {
      state.route = 'home';
      document.querySelector('[data-nav=home]')?.classList.add('active');
      renderHome();
    } else if ((m = path.match(/^\/anime\/(.+)/))) {
      state.route = 'details';
      renderDetails(extractMalIdFromSlug(decodeURIComponent(m[1])));
    } else if ((m = path.match(/^\/watch\/(.+)/))) {
      state.route = 'watch';
      renderWatch(extractMalIdFromSlug(decodeURIComponent(m[1])));
    } else if (path === '/news') {
      state.route = 'news';
      document.querySelector('[data-nav=news]')?.classList.add('active');
      renderNews();
    } else {
      state.route = path.replace('/', '') || 'anime';
      document.querySelector(`[data-nav=${state.route}]`)?.classList.add('active');
      if (state.route === 'az') state.letter = p.get('letter') || 'All';
      renderCatalog(state.route);
    }
    $('navLinks').classList.remove('open');
    const homeLink = document.querySelector('[data-nav=home]');
    if (homeLink) homeLink.style.display = state.route === 'home' ? 'none' : '';
  }

  function refreshCountdowns() {
    document.querySelectorAll('[data-airing]').forEach(el => {
      const seconds = Number(el.dataset.airing) - Math.floor(Date.now() / 1000);
      const text = countdownFromSeconds(seconds);
      if (text) el.textContent = text;
    });
  }

  // --- Preferences & Init -------------------------------------
  function getPrefs() {
    return {
      track: 'sub',
      ...readJson(ANICADE_KEYS.prefs, {})
    };
  }
  function setPref(key, value) {
    const p = getPrefs();
    p[key] = value;
    writeJson(ANICADE_KEYS.prefs, p);
    showToast('Preference saved');
  }

  $('themeToggle').addEventListener('click', () => {
    const light = !document.body.classList.contains('light');
    document.body.classList.toggle('light', light);
    localStorage.setItem('anicade_theme', light ? 'light' : 'dark');
    $('themeToggle').querySelector('i').className = light ? 'fas fa-sun' : 'fas fa-moon';
  });
  $('menuToggle').addEventListener('click', () => $('navLinks').classList.toggle('open'));
  $('topSearchForm').addEventListener('submit', e => {
    e.preventDefault();
    const q = $('topSearchInput').value.trim();
    if (!q) return;
    const target = `#/anime?q=${encodeURIComponent(q)}`;
    if (location.hash === target) route(); else location.hash = target;
  });

  if (localStorage.getItem('anicade_theme') === 'light') document.body.classList.add('light');
  window.addEventListener('hashchange', route);
  setInterval(refreshCountdowns, 60000);
  route();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
